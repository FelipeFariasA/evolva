<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a3a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1a3a" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap">
<title>Evolva</title>
<meta name="description" content="Rutinas por niveles, alimentación y semáforo de evolución semanal.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Evolva · mundo "Mapa de Metro". Esmalte azul noche, placa de porcelana, una línea de color por objetivo.
   Verde, ámbar y rojo quedan reservados para el estado del servicio (el semáforo). */
:root{
  --noche:#0e1a3a; --noche-2:#16244b; --noche-3:#26345f; --porcelana:#f4f1ea;
  --placa:#f4f1ea; --ground:#f4f1ea; --plate:#fbfaf7; --plate-2:#ebe7dd; --tx:#0e1a3a; --mut:#4a5578; --line:#d5d0c3;
  --on-noche:#f4f1ea; --on-noche-mut:#aab3cf;
  --linea:#2f6fe4; --on-linea:#ffffff;
  --pri:var(--linea); --pri-tx:var(--on-linea); --ring:#2f6fe4;
  --verde:#1f9d5c; --amarillo:#f2b200; --rojo:#d93025; --on-verde:#ffffff; --on-amarillo:#0e1a3a; --on-rojo:#ffffff;
  --entreno:var(--linea); --nutri:#b5652b; --cuerpo:#0f8f9e;
  --sh:0 1px 0 rgba(14,26,58,.06),0 6px 18px rgba(14,26,58,.07);
  --r-lg:10px; --r-md:8px; --r-sm:6px;
  --t-fast:140ms; --t-med:260ms; --ease:cubic-bezier(.16,1,.3,1);
  --f-head:"SepFix","Overpass",system-ui,sans-serif; --f-body:"SepFix","Overpass",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-obj="bajar_grasa"]{--linea:#c0601e;--ring:#c0601e}
:root[data-obj="movilidad"]{--linea:#0f8f9e;--ring:#0f8f9e}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --placa:#f4f1ea; --ground:#0e1a3a; --plate:#16244b; --plate-2:#1d2d5a; --tx:#f4f1ea; --mut:#aab3cf; --line:#2b3a68;
    --linea:#5b8ff0; --on-linea:#08112a; --ring:#9dbaf6;
    --verde:#34c37a; --amarillo:#ffc629; --rojo:#ff6a5c; --on-verde:#06210f; --on-amarillo:#1c1500; --on-rojo:#2a0606;
    --nutri:#e08a4a; --cuerpo:#2fc1d0; --sh:none; color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-obj="bajar_grasa"]{--linea:#e08a4a;--ring:#f0b58a}
  :root:not([data-theme="light"])[data-obj="movilidad"]{--linea:#2fc1d0;--ring:#8fe2ea}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;accent-color:var(--linea);caret-color:var(--linea);scrollbar-color:color-mix(in srgb,var(--mut) 45%,transparent) transparent}
body{margin:0;background:var(--ground);color:var(--tx);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
::selection{background:color-mix(in srgb,var(--linea) 32%,transparent);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
button,summary,.chip,.res{cursor:pointer}
input,select,textarea{font-size:16px;width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--plate);transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
textarea{min-height:auto}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--linea);box-shadow:0 0 0 3px color-mix(in srgb,var(--linea) 28%,transparent)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin:14px 0 6px}
h1,h2,h3{margin:0;line-height:1.1;font-family:var(--f-head);font-weight:800;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px;font-weight:700}
.ico{width:20px;height:20px;flex-shrink:0;vertical-align:-4px}
[aria-busy="true"]{cursor:progress}
.btn[aria-busy="true"]::before{content:"";width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
/* shell */
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding:0 0 calc(92px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--noche);color:var(--on-noche)}
header.top .logo{width:30px;height:30px}
header.top h1{font-size:22px;font-weight:900;letter-spacing:.06em}
header.top .sub{margin-left:auto;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-noche-mut)}
header.top .sub>span:last-child{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-head);font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--on-noche);text-transform:uppercase}
.badge i{width:14px;height:14px;border-radius:50%;background:var(--porcelana);border:4px solid var(--linea)}
main#view{padding:0 16px}
/* la banda azul noche del shell llega a ambos bordes aunque la columna mida 560 px */
.app header.top,.app .linea-nivel{box-shadow:0 0 0 100vmax var(--noche);clip-path:inset(0 -100vmax)}
.card{background:var(--plate);border-radius:var(--r-lg);padding:18px 16px;margin:12px 0;box-shadow:var(--sh)}
.sec{padding:20px 0 4px}
.sec+.sec{border-top:1px solid var(--line)}
.muted{color:var(--mut)} .small{font-size:14px}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-md);padding:12px 18px;background:var(--linea);color:var(--on-linea);font-weight:800;font-size:16px;letter-spacing:.01em;min-height:48px;transition:filter var(--t-fast) var(--ease),transform 110ms var(--ease)}
.btn:active:not(:disabled){transform:scale(.97)}
@media (hover:hover){.btn:hover:not(:disabled){filter:brightness(1.08)} .chip:hover{border-color:var(--linea)} .res:hover{border-color:var(--linea)}}
.btn.sec{background:color-mix(in srgb,var(--linea) 14%,var(--plate));color:var(--tx)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--tx)}
.btn.danger{background:var(--rojo);color:var(--on-rojo)}
.btn.full{width:100%}
.btn.icon{min-width:44px;min-height:44px;padding:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--plate);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;min-height:44px;transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform 110ms var(--ease)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--linea);border-color:var(--linea);color:var(--on-linea);font-weight:800}
.chip.actual::after{content:"· actual";margin-left:6px;font-size:12px;font-weight:700;opacity:.85}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--noche);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{display:flex;max-width:560px;width:100%;padding:4px 4px 2px}
nav.tabs button{flex:1;background:none;border:0;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--on-noche-mut);min-height:58px;position:relative;transition:color var(--t-fast) var(--ease)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button::before{content:"";position:absolute;top:0;left:28%;right:28%;height:4px;border-radius:0 0 3px 3px;background:var(--linea);transform:scaleX(0);transition:transform var(--t-med) var(--ease)}
nav.tabs button.on{color:var(--on-noche);font-weight:800}
nav.tabs button.on::before{transform:scaleX(1)}
/* firma: diagrama de línea */
.linea-nivel{background:var(--noche);color:var(--on-noche);margin:0 -16px;padding:4px 28px 52px;position:relative}
.linea-nivel .riel{position:relative;height:6px;margin:30px 0 0;background:var(--noche-3);border-radius:3px}
.linea-nivel .riel b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--linea);transform-origin:left;animation:rielIn 900ms var(--ease) both}
@keyframes rielIn{from{transform:scaleX(0)}}
.est{font-style:normal;position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--porcelana);border:5px solid var(--noche-3)}
.est.ok{border-color:var(--linea)}
.est.aqui{width:30px;height:30px;margin:-15px 0 0 -15px;border-width:7px;border-color:var(--linea);box-shadow:0 0 0 4px var(--noche)}
.est span{position:absolute;top:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:var(--on-noche-mut)}
.est.aqui span{top:28px;color:var(--on-noche);font-weight:800}
.est:first-of-type span{left:0;transform:none} .est:last-of-type span{left:auto;right:0;transform:none}
.est.aqui:first-of-type span{left:-4px}
.tren{position:absolute;top:-30px;transform:translateX(-50%);background:var(--porcelana);color:var(--noche);font:800 12px/1 var(--f-head);padding:5px 7px;border-radius:4px;white-space:nowrap}
.tren::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--porcelana)}
.placa{background:var(--placa);color:var(--noche);border-radius:var(--r-lg);padding:16px;margin:-12px 0 0;position:relative;box-shadow:0 10px 28px rgba(14,26,58,.22);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.placa .light{grid-row:1/3}
.light{width:92px;height:92px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.light b{font:900 48px/.9 var(--f-head)}
.light span{font-size:12px;font-weight:700;opacity:.85}
.light.verde{background:var(--verde);color:var(--on-verde)} .light.amarillo{background:var(--amarillo);color:var(--on-amarillo)} .light.rojo{background:var(--rojo);color:var(--on-rojo)}
.estado{font:900 26px/1.05 var(--f-head);letter-spacing:-.01em}
.servicio{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.servicio .ico{width:18px;height:18px}
.placa .motivo{grid-column:1/3;margin:10px 0 0;padding-top:10px;border-top:1.5px solid #d9d3c4;font-size:15px}
.placa .motivo ul{margin:6px 0 0;padding-left:18px;color:#3b4669;font-size:14px}
.ramales{display:grid;gap:12px;margin-top:6px}
.ramal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.ramal span{font-size:14px;font-weight:600;color:var(--mut)}
.ramal b{font:900 22px/1 var(--f-head)}
.ramal .t{grid-column:1/3;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ramal .t i{display:block;height:100%;width:100%;border-radius:3px;transform-origin:left;transform:scaleX(calc(var(--p,0)/100));transition:transform 600ms var(--ease)}
.semana{display:flex;justify-content:space-between;position:relative;margin-top:12px}
.semana::before{content:"";position:absolute;top:12px;left:12px;right:12px;height:6px;border-radius:3px;background:var(--line)}
.dia{position:relative;text-align:center;font-size:12px;font-weight:700;color:var(--mut);width:30px}
.dia i{display:block;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--ground);border:5px solid var(--line)}
.dia.ok i{background:var(--linea);border-color:var(--linea)}
.dia.hoy{color:var(--tx);font-weight:900}
.dia.hoy i{border-color:var(--linea)}
.dia.hoy::after{content:"hoy";position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--linea)}
/* letrero de estación: la próxima parada como señal, no como alerta genérica */
.letrero{background:var(--noche);color:var(--on-noche);border-radius:var(--r-lg);padding:14px 16px;margin-top:4px}
.letrero h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--porcelana);border:5px solid var(--linea);margin-right:10px;vertical-align:-1px}
.letrero.good h2::before{border-color:var(--verde)} .letrero.bad h2::before{border-color:var(--rojo)}
.letrero .small{color:var(--on-noche-mut);font-weight:700}
.letrero h2{margin-top:6px}
.letrero p{color:var(--on-noche)}
.letrero .btn.sec{background:var(--noche-3);color:var(--on-noche)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .letrero{background:var(--noche-2)}}
.placa{border:1.5px solid #d9d3c4}
/* el punto medio de Overpass queda pegado al texto siguiente: se toma de una fuente del sistema */
@font-face{font-family:"SepFix";src:local("Segoe UI"),local("Arial"),local("Helvetica Neue"),local("Roboto");unicode-range:U+00B7}
::placeholder{color:var(--mut);opacity:1;font-style:italic;font-weight:400}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{border-top:2px solid var(--line);padding-top:8px}
.kpi b{display:block;font:900 26px/1 var(--f-head)}
.kpi span{font-size:13px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:100%;background:var(--linea);border-radius:3px;transform-origin:left;transform:scaleX(calc(var(--p,0) / 100));transition:transform 500ms var(--ease)}
.alert{border-radius:var(--r-md);padding:14px;background:color-mix(in srgb,var(--linea) 10%,var(--plate));font-size:15px;border:1.5px solid color-mix(in srgb,var(--linea) 30%,transparent)}
.alert.warn{background:color-mix(in srgb,var(--amarillo) 14%,var(--plate));border-color:color-mix(in srgb,var(--amarillo) 45%,transparent)}
.alert.bad{background:color-mix(in srgb,var(--rojo) 11%,var(--plate));border-color:color-mix(in srgb,var(--rojo) 40%,transparent)}
.alert.good{background:color-mix(in srgb,var(--verde) 11%,var(--plate));border-color:color-mix(in srgb,var(--verde) 40%,transparent)}
.alert b{font-weight:800}
ul.mot{margin:8px 0 0;padding-left:18px} ul.mot li{margin:4px 0}
/* rutina: la ruta de la sesión */
.ruta{position:relative;margin-top:6px}
.ruta::before{content:"";position:absolute;top:22px;bottom:22px;left:21px;width:6px;border-radius:3px;background:var(--line)}
.ex{position:relative;padding:14px 0 16px 62px}
.ex .picto{position:absolute;left:0;top:12px;width:48px;height:48px;border-radius:10px;background:var(--linea);color:var(--on-linea);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--ground)}
.ex .picto svg{width:34px;height:34px}
.ex .num{position:absolute;left:34px;top:4px;min-width:22px;height:22px;border-radius:11px;background:var(--noche);color:var(--on-noche);font:800 12px/22px var(--f-head);text-align:center;padding:0 5px;box-shadow:0 0 0 3px var(--ground)}
.ex h3{font-size:18px}
.ex .meta{font-size:14px;color:var(--mut);margin-top:2px}
.ex .var{font-size:14px;color:var(--mut);margin-top:6px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:8px;align-items:center;margin-top:12px}
.sets.sin-carga{grid-template-columns:28px 1fr 1fr}
.sets .h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sets input,.sets select{padding:8px;text-align:center;min-height:44px}
.sets .n{font:800 17px var(--f-head);color:var(--mut);text-align:center}
.last{font-size:14px;color:var(--tx);margin-top:6px;font-weight:600}
.last::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--linea);margin-right:6px;vertical-align:1px}
.check{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-size:15px;color:var(--tx);font-weight:500}
.check input{width:22px;height:22px;min-height:22px;margin-top:1px;flex-shrink:0}
/* comida */
.macro{margin:12px 0}
.macro .row{font-size:14px}
.macro .row>span:last-child{white-space:nowrap}
.kcal{display:flex;align-items:baseline;gap:8px}
.kcal b{font:900 44px/1 var(--f-head)}
.meal{border-top:1px solid var(--line);padding:14px 0}
.meal:first-child{border-top:0;padding-top:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;padding:6px 0}
.item .x{background:none;border:0;color:var(--mut);min-width:44px;min-height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.item .x:hover{background:color-mix(in srgb,var(--rojo) 12%,transparent);color:var(--rojo)}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1.5px solid var(--line);border-radius:var(--r-md);margin:8px 0;background:var(--plate);width:100%;text-align:left;min-height:48px;transition:border-color var(--t-fast) var(--ease)}
.res.on{border-color:var(--linea);background:color-mix(in srgb,var(--linea) 10%,var(--plate))}
.tag{font-size:12px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px}
/* progreso: historial como línea */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--mut);font-size:11px;font-family:var(--f-body)}
svg.chart .grid{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.historial{position:relative;margin-top:8px}
.historial::before{content:"";position:absolute;top:18px;bottom:18px;left:13px;width:6px;border-radius:3px;background:var(--line)}
.hist{position:relative;display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.hist .d{position:relative;width:32px;height:32px;border-radius:50%;flex-shrink:0;border:6px solid;background:var(--plate);box-shadow:0 0 0 3px var(--plate)}
.hist b.p{font:900 22px/1 var(--f-head)}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));max-height:88dvh;background:var(--plate);color:var(--tx)}
dialog::backdrop{background:rgba(8,14,34,.62)}
dialog[open]{animation:dlgIn var(--t-med) var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(14px)}}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 10px 18px;background:var(--noche);color:var(--on-noche);position:sticky;top:0;z-index:1}
dialog .dh .btn.ghost{color:var(--on-noche);border-color:var(--noche-3)}
dialog .db{padding:14px 18px 20px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--porcelana);color:var(--noche);padding:12px 18px;border-radius:var(--r-md);font-size:15px;font-weight:700;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 12px 30px rgba(8,14,34,.35);border-left:0;animation:toastIn var(--t-med) var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
.aviso{font-size:13px;color:var(--mut);text-align:center;margin:20px 4px}
/* ingreso */
.login{min-height:100dvh;background:var(--noche);color:var(--on-noche);padding:calc(28px + env(safe-area-inset-top)) max(20px, calc((100% - 440px) / 2)) 32px}
.login .logo{width:40px;height:40px}
.wordmark{font:900 20px var(--f-head);letter-spacing:.08em}
.login h1{font-size:40px;line-height:1;margin:26px 0 12px;font-weight:900}
.login h1 em{font-style:normal;color:var(--linea)}
.login .lead{color:var(--on-noche-mut);margin:0}
.login .linea-nivel{margin:22px -20px 6px;padding:4px 32px 46px}
.hitos{list-style:none;margin:6px 0 18px;padding:0;display:grid;gap:10px;font-size:15px;color:var(--on-noche-mut)}
.hitos li{display:flex;gap:12px;align-items:flex-start}
.hitos i{width:12px;height:12px;border-radius:50%;margin-top:5px;flex-shrink:0;box-shadow:0 0 0 3px var(--noche),0 0 0 5px currentColor}
.hitos b{color:var(--on-noche)}
.login .card{background:var(--porcelana);color:var(--noche);box-shadow:none}
.login .card label{color:#4a5578}
.login .card input{background:#fff;border-color:#d5d0c3;color:var(--noche)}
.login .card .muted{color:#4a5578}
.login .card input::placeholder{color:#5a6488}
.login .aviso{color:var(--on-noche-mut)}
.login .btn.ghost{color:var(--on-noche);border-color:var(--noche-3)}
.login h3{color:var(--noche)}
.empty{text-align:center;padding:28px 8px;color:var(--mut)}
.spin{display:inline-block;width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--linea);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .spin{animation-duration:1.6s!important;animation-iteration-count:infinite!important}
}
@media (max-width:370px){.light{width:78px;height:78px}.light b{font-size:40px}.estado{font-size:22px}.login h1{font-size:34px}.est span{font-size:11px}}
@media (min-width:600px){main#view{padding:0 20px}.linea-nivel{margin:0 -20px}}

function lineaNivel(nivel, progreso, { etiqueta = true } = {}) {
  const idx = NIVELES.indexOf(nivel), p = Math.max(0, Math.min(100, progreso || 0));
  const fin = idx >= 2 ? 100 : idx * 50 + p / 2;
  const sig = NIVELES[idx + 1];
  const aria = sig ? `Estación ${NIVEL_TX[nivel]}, ${r0(p)}% del tramo hacia ${NIVEL_TX[sig]}` : `Estación ${NIVEL_TX[nivel]}, nivel más alto`;
  return `<div class="linea-nivel" role="img" aria-label="${aria}"><div class="riel"><b style="width:${fin}%"></b>
    ${NIVELES.map((n, i) => `<i class="est ${i < idx ? 'ok' : ''} ${i === idx ? 'aqui' : ''}" style="left:${i * 50}%"><span>${NIVEL_TX[n]}</span></i>`).join('')}
    ${etiqueta && sig ? `<em class="tren" style="left:${fin}%;font-style:normal">${r0(p)}%</em>` : ''}</div></div>`;
}

const iso = d => d.toLocaleDateString('sv-SE');

const deIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

function toast(msg, ms = 2600) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), Math.max(ms, msg.length * 60));
}
// Bloquea el botón mientras una acción guarda, para evitar envíos duplicados.
async function ocupado(btn, fn) {
  if (!btn || btn.getAttribute('aria-busy') === 'true') return;
  btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  try { return await fn(); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.removeAttribute('aria-busy'); } }
}
function errMsg(e) {

  if (/schema must be one of|PGRST106|Invalid schema/i.test(m)) return 'El schema "evolva" aún no está expuesto en la API de Supabase (Settings → Data API → Exposed schemas).';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión. Inténtalo de nuevo.';
  return m;
}

async function tieneAcceso() {

async function iniciar(user) {
  S.user = user;
  const turno = S.turno = (S.turno || 0) + 1; // solo el arranque más reciente dibuja la pantalla
  $('#root').innerHTML = `<div class="empty" style="padding-top:30vh"><span class="spin"></span></div>`;
  const [{ data: perfil, error }, acceso] = await Promise.all([
    sb.from('perfiles').select('*').eq('id', user.id).maybeSingle(),
    tieneAcceso().catch(e => ({ error: e }))
  ]);
  if (turno !== S.turno) return;
  const fallo = e => { $('#root').innerHTML = `<div class="login"><div class="alert bad" role="alert">${esc(errMsg(e))}</div><button class="btn sec" id="ini-reintentar" style="margin-top:12px">Reintentar</button> <button class="btn ghost" style="margin-top:12px" onclick="salir()">Cerrar sesión</button></div>`; $('#ini-reintentar').onclick = () => iniciar(user); };
  const errorCarga = error || acceso?.error;
  if (errorCarga) return fallo(errorCarga);
  if (acceso !== true) return vSinAcceso(perfil);
  if (!perfil) return vOnboarding();
  S.perfil = perfil;
  try { await cargarBase(); } catch (e) { if (turno === S.turno) fallo(e); return; }
  if (turno !== S.turno) return;
  sincronizarCola();
  vApp();
}

async function cargarBase() {
  const [ej, ru, me, al] = await Promise.all([
    sb.from('ejercicios').select('*').order('id'),
    sb.from('rutinas').select('*, rutina_ejercicios(*)').order('id'),
    sb.from('metas_nutricionales').select('*').eq('usuario_id', S.user.id).maybeSingle(),
    sb.from('alimentos').select('*').order('nombre')
  ]);
  S.ejercicios = ej.data || [];
  S.rutinas = (ru.data || []).map(r => ({ ...r, rutina_ejercicios: (r.rutina_ejercicios || []).sort((a, b) => a.orden - b.orden) }));
  S.meta = me.data;
  S.alimentos = al.data || [];
  if (!S.meta) { const { data } = await sb.rpc('calcular_mi_meta'); S.meta = data; }
}

function chart(series, { h = 170, fmtY = v => v, unidad = '', enteros = false } = {}) {
  const all = series.flatMap(s => s.pts);
  if (all.length < 2) return `<p class="empty small">Aún no hay datos suficientes para el gráfico.</p>`;
  const W = 360, H = Math.round(h * 0.62), P = { l: 34, r: 8, t: 10, b: 20 };
  let x0 = Math.min(...all.map(p => p.x)), x1 = Math.max(...all.map(p => p.x));
  let y0 = Math.min(...all.map(p => p.y)), y1 = Math.max(...all.map(p => p.y));
  if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.12; const sinNeg = y0 >= 0; y0 -= pad; y1 += pad; if (sinNeg) y0 = Math.max(0, y0);
  if (enteros) { y0 = Math.floor(y0); y1 = Math.ceil(y1); while ((y1 - y0) % 3) y1++; }
  const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r);
  const Y = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = y0 + (y1 - y0) * i / 3, y = Y(v);
    g += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end">${fmtY(v)}</text>`;
  }
  const fx = x => new Date(x).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
  g += `<text x="${P.l}" y="${H - 6}">${fx(x0)}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${fx(x1)}</text>`;
  const paths = series.map(s => {
    if (!s.pts.length) return '';
    const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    const dots = s.dots ? s.pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${s.color}"><title>${fx(p.x)}: ${r1(p.y)} ${unidad}</title></circle>`).join('') : '';
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2.5}" ${s.dash ? 'stroke-dasharray="5 5"' : ''} stroke-linejoin="round" stroke-linecap="round" opacity="${s.op || 1}"/>${dots}`;
  }).join('');
  const leg = series.filter(s => s.label).map(s => `<span><i style="background:${s.color};${s.dots && s.w && s.w < 2 ? 'width:8px;height:8px;border-radius:50%' : ''}"></i>${s.label}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${paths}</svg>${leg ? `<div class="legend">${leg}</div>` : ''}`;
}

async function cambiarNivel(nivel, motivo) {
  if (!confirm(`¿Cambiar tu nivel a ${NIVEL_TX[nivel]}?`)) return;
  const { data, error } = await sb.rpc('cambiar_mi_nivel', { p_nivel: nivel, p_motivo: motivo || null });
  if (error) return toast(errMsg(error));
  S.perfil = data; refrescarHeader(); toast(`Ahora estás en ${NIVEL_TX[nivel]}`); ir(S.tab);
}

// ---------- RUTINA ----------
const COLA = 'evolva_cola_v1';
const BORRADOR = 'evolva_borrador_v1';
const leerLS = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const guardarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } };

async function vRutina(nivelVer, diaVer) {
  const nivel = nivelVer || S.perfil.nivel;
  const { data: ult } = await sb.from('sesiones').select('id, fecha, rutina_id').order('fecha', { ascending: false }).order('id', { ascending: false }).limit(1);
  const ultRut = ult?.[0] && S.rutinas.find(r => r.id === ult[0].rutina_id);
  const dia = diaVer || (ultRut?.dia === 'A' ? 'B' : 'A');
  const rut = S.rutinas.find(r => r.objetivo === S.perfil.objetivo && r.nivel === nivel && r.dia === dia);
  if (!rut) { $('#view').innerHTML = `<div class="card empty">No hay rutina para este nivel.</div>`; return; }

  // última vez que hiciste cada ejercicio
  const ids = rut.rutina_ejercicios.map(x => x.ejercicio_id);
  const { data: prev } = await sb.from('series').select('ejercicio_id, sesion_id, n_serie, reps, carga_kg, rpe, sesiones(fecha)').in('ejercicio_id', ids).order('sesion_id', { ascending: false }).limit(300);
  const ultimo = {};
  (prev || []).forEach(s => { const u = ultimo[s.ejercicio_id]; if (!u) ultimo[s.ejercicio_id] = { sesion: s.sesion_id, fecha: s.sesiones?.fecha, series: [s] }; else if (u.sesion === s.sesion_id) u.series.push(s); });

  // Misma fuente en vivo que Inicio, para que el avance sea un solo número en toda la app.
  const { data: ev } = await sb.rpc('evaluar_mi_semana', { p_semana: hoy() });
  const borr = leerLS(BORRADOR, {})[rut.id] || {};
  const cola = leerLS(COLA, []);
  const viendoOtro = nivel !== S.perfil.nivel;

  const exHtml = rut.rutina_ejercicios.map((re, idx) => {
    const e = ejercicio(re.ejercicio_id); if (!e) return '';
    const f = e.mas_facil_id && ejercicio(e.mas_facil_id), dif = e.mas_dificil_id && ejercicio(e.mas_dificil_id);
    const u = ultimo[e.id];
    const uTxt = u ? `Última vez (${fCorta(u.fecha)}): ${u.series.sort((a, b) => a.n_serie - b.n_serie).map(s => `${r1(s.reps)}${e.usa_carga && s.carga_kg ? '×' + r1(s.carga_kg) + 'kg' : ''}`).join(' · ')}` : '';
    const filas = Array.from({ length: re.series }, (_, i) => {
      const b = borr[`${e.id}_${i + 1}`] || {};
      const pc = u?.series.find(s => s.n_serie === i + 1)?.carga_kg;
      return `<div class="n">${i + 1}</div>
        <input inputmode="decimal" data-k="${e.id}_${i + 1}" data-f="reps" value="${esc(b.reps ?? '')}" placeholder="${re.reps_max}" aria-label="${UNIDAD_TX[e.unidad]} serie ${i + 1}">
        ${e.usa_carga ? `<input inputmode="decimal" data-k="${e.id}_${i + 1}" data-f="carga" value="${esc(b.carga ?? '')}" placeholder="${pc != null ? r1(pc) : 'kg'}" aria-label="carga serie ${i + 1}">` : ''}
        <select data-k="${e.id}_${i + 1}" data-f="rpe" aria-label="esfuerzo serie ${i + 1}"><option value="">RPE</option>${Array.from({ length: 10 }, (_, j) => `<option ${String(b.rpe) === String(j + 1) ? 'selected' : ''}>${j + 1}</option>`).join('')}</select>`;
    }).join('');
    return `<div class="ex" data-ej="${e.id}" data-series="${re.series}">
      <div class="picto" role="img" aria-label="Pictograma: ${esc(e.nombre)}">${pictogramaEj(e)}</div><span class="num" aria-hidden="true">${idx + 1}</span>
      <h3>${esc(e.nombre)}</h3><div class="meta">${esc(e.grupo_muscular)} · ${re.series} series de ${re.reps_min}–${re.reps_max} ${UNIDAD_TX[e.unidad]}</div>
      <div class="small muted" style="margin-top:4px">${esc(e.descripcion || '')}</div>
      ${f || dif ? `<div class="var">${f ? `Más fácil: ${esc(f.nombre)}` : ''}${f && dif ? ' · ' : ''}${dif ? `Más difícil: ${esc(dif.nombre)}` : ''}</div>` : ''}
      ${uTxt ? `<div class="last">${esc(uTxt)}</div>` : ''}
      <div class="sets ${e.usa_carga ? '' : 'sin-carga'}"><div class="h"></div><div class="h">${UNIDAD_TX[e.unidad]}</div>${e.usa_carga ? '<div class="h">kg</div>' : ''}<div class="h">Esfuerzo</div>${filas}</div>
    </div>`;
  }).join('');

  $('#view').innerHTML = `
    ${ev ? lineaNivel(S.perfil.nivel, ev.progreso_nivel) : ''}
    <section class="sec">
      <h2>Rutina de ${OBJ_TX[S.perfil.objetivo].toLowerCase()}</h2>
      <label>Nivel</label>
      <div class="chips" id="r-niv" role="group" aria-label="Nivel">${NIVELES.map(k => `<button class="chip ${k === nivel ? 'on' : ''} ${k === S.perfil.nivel ? 'actual' : ''}" aria-pressed="${k === nivel}" data-v="${k}">${NIVEL_TX[k]}</button>`).join('')}</div>
      <label>Día</label>
      <div class="chips" id="r-dia" role="group" aria-label="Día">${['A', 'B'].map(k => `<button class="chip ${k === dia ? 'on' : ''}" aria-pressed="${k === dia}" data-v="${k}">Día ${k}</button>`).join('')}</div>
      ${viendoOtro ? `<div class="alert warn" style="margin-top:12px">Estás viendo ${NIVEL_TX[nivel]}. Tu nivel actual es ${NIVEL_TX[S.perfil.nivel]}.<br><button class="btn sec" id="r-cambiar" style="margin-top:8px">Cambiar mi nivel a ${NIVEL_TX[nivel]}</button></div>` : ''}
      ${ev && !viendoOtro && ev.decision === 'subir' ? `<div class="alert good" style="margin-top:12px"><b>Listo para la próxima estación.</b> Cumpliste las reglas para subir de nivel.</div>` : ''}
      ${cola.length ? `<div class="alert warn small" style="margin-top:12px">${cola.length} ${cola.length === 1 ? 'sesión pendiente' : 'sesiones pendientes'} de sincronizar.</div>` : ''}
    </section>
    <section class="sec" id="r-ej">
      <div class="row between" style="align-items:baseline"><h2>Ruta de hoy</h2><span class="small muted">${esc(rut.nombre)}</span></div>
      <p class="small muted" style="margin:4px 0 0">Anota repeticiones (o segundos), carga y esfuerzo del 1 al 10.</p>
      <div class="ruta">${exHtml}</div>
    </section>
    <section class="sec" style="padding-bottom:16px">
      <label class="check"><input type="checkbox" id="r-dolor"> Sentí dolor durante la sesión</label>
      <label for="r-nota">Nota (opcional)</label>
      <input id="r-nota" placeholder="Cómo te sentiste">
      <button class="btn full" id="r-guardar" style="margin-top:14px">Guardar sesión</button>
      <p class="small muted" style="margin:8px 0 0">Sin conexión, la sesión se guarda en el teléfono y se sincroniza al volver.</p>
    </section>`;

  $('#r-niv').onclick = e => { const b = e.target.closest('.chip'); if (b) vRutina(b.dataset.v, dia); };
  $('#r-dia').onclick = e => { const b = e.target.closest('.chip'); if (b) vRutina(nivel, b.dataset.v); };
  if ($('#r-cambiar')) $('#r-cambiar').onclick = () => cambiarNivel(nivel, 'Cambio manual desde Rutina');
  $('#r-ej').addEventListener('input', guardarBorrador);
  $('#r-ej').addEventListener('change', guardarBorrador);
  function guardarBorrador(ev2) {
    const el = ev2.target; if (!el.dataset.k) return;
    const all = leerLS(BORRADOR, {}); const b = all[rut.id] || (all[rut.id] = {});
    (b[el.dataset.k] ||= {})[el.dataset.f] = el.value; guardarLS(BORRADOR, all);
  }
  $('#r-dolor').onchange = e => { if (e.target.checked) toast('Detén el ejercicio que te duele. Si el dolor persiste, consulta a un profesional.', 4500); };
  $('#r-guardar').onclick = async () => {
    const series = [];
    document.querySelectorAll('#r-ej .ex').forEach(ex => {
      const ej = Number(ex.dataset.ej);
      for (let i = 1; i <= Number(ex.dataset.series); i++) {
        const g = f => ex.querySelector(`[data-k="${ej}_${i}"][data-f="${f}"]`)?.value;
        const reps = num(g('reps')); if (reps == null) continue;
        series.push({ ejercicio_id: ej, n_serie: i, reps, carga_kg: num(g('carga')), rpe: num(g('rpe')) });
      }
    });
    if (!series.length) return toast('Registra al menos una serie.');
    const reg = { sesion: { fecha: hoy(), rutina_id: rut.id, dolor: $('#r-dolor').checked, nota: $('#r-nota').value.trim() || null }, series };
    const btn = $('#r-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
    const ok = await subirSesion(reg);
    if (!ok) { const c = leerLS(COLA, []); c.push(reg); guardarLS(COLA, c); toast('Sin conexión: guardada en el teléfono. Se sincronizará sola.'); }
    else toast(reg.sesion.dolor ? 'Sesión guardada. Como reportaste dolor, la app te sugerirá bajar la intensidad.' : '¡Sesión guardada!', 3500);
    const all = leerLS(BORRADOR, {}); delete all[rut.id]; guardarLS(BORRADOR, all);
    ir('inicio');
  };
}

async function subirSesion(reg) {
  if (!navigator.onLine) return false;
  try {
    const { data, error } = await sb.from('sesiones').insert(reg.sesion).select('id').single();
    if (error) throw error;
    const { error: e2 } = await sb.from('series').insert(reg.series.map(s => ({ ...s, sesion_id: data.id })));
    if (e2) { await sb.from('sesiones').delete().eq('id', data.id); throw e2; }
    return true;
  } catch (e) {
    if (/fetch|network/i.test(e?.message || '')) return false;
    toast(errMsg(e)); return true; // error de datos: no reintentar en bucle
  }
}
async function sincronizarCola() {
  const c = leerLS(COLA, []); if (!c.length || !navigator.onLine) return;
  const quedan = [];
  for (const reg of c) if (!(await subirSesion(reg))) quedan.push(reg);
  guardarLS(COLA, quedan);
  if (quedan.length < c.length) toast(`${c.length - quedan.length} ${c.length - quedan.length === 1 ? 'sesión sincronizada' : 'sesiones sincronizadas'}`);
}
window.addEventListener('online', sincronizarCola);

// ---------- COMIDA ----------
function comidaSugerida() {
  const h = new Date().getHours();
  return h < 11 ? 'desayuno' : h < 15 ? 'almuerzo' : h < 18 ? 'colacion' : 'cena';
}
function sugerencia(tot) {
  const m = S.meta; if (!m) return '';
  const faltaP = m.proteina_g - tot.proteina, faltaK = m.kcal - tot.kcal;
  const prox = comidaSugerida();
  if (faltaK <= 0) return `Ya cubriste tu meta de calorías de hoy. Si tienes hambre, prefiere verduras, una fruta o un yogur natural: escucha tu cuerpo, no se trata de restringir.`;
  if (faltaP < 10) return `Tu proteína de hoy está cubierta. Para ${COMIDA_TX[prox].toLowerCase()} elige algo con verduras y carbohidratos para completar ${r0(faltaK)} kcal.`;
  // alimentos con más proteína por caloría que caben en lo que falta
  const cand = S.alimentos.filter(a => a.proteina >= 8 && a.kcal > 0)
    .map(a => { const g = Math.min(Math.max(Math.round((Math.min(faltaP, 40) / a.proteina) * 100 / 10) * 10, 30), 300); return { a, g, k: a.kcal * g / 100, p: a.proteina * g / 100 }; })
    .filter(c => c.k <= faltaK * 0.8)
    .sort((x, y) => (y.p / y.k) - (x.p / x.k)).slice(0, 2);
  const ops = cand.map(c => `${c.g} g de ${c.a.nombre.toLowerCase()} (${r0(c.p)} g de proteína, ${r0(c.k)} kcal)`).join(' o ');
  return `Te faltan ${r0(faltaP)} g de proteína y ${r0(faltaK)} kcal. Para ${COMIDA_TX[prox].toLowerCase()}${ops ? ` prueba ${ops}` : ' suma una fuente de proteína'}.`;
}
function macroBar(nombre, val, meta, color, unidad = 'g') {
  const pct = meta ? val / meta * 100 : 0;
  const est = !meta ? '' : pct > 115 ? 'Sobre la meta' : pct >= 90 ? 'En meta' : pct >= 60 ? '' : 'Bajo';
  const c = !meta ? color : pct > 115 ? cssVar('--rojo') : pct >= 90 ? cssVar('--verde') : color;
  return `<div class="macro"><div class="row between"><span>${nombre} ${est ? `<span class="tag">${est}</span>` : ''}</span><span><b>${r0(val)}</b> / ${meta ?? '—'} ${unidad}</span></div><div class="bar" style="margin-top:4px"><i style="--p:${Math.min(pct, 100)};background:${c}"></i></div></div>`;
}

async function vComida() {
  const f = S.fechaComida || hoy();
  const { data: regs, error } = await sb.from('registros_alimento').select('*').eq('fecha', f).order('id');
  if (error) throw error;
  const tot = (regs || []).reduce((t, r) => ({ kcal: t.kcal + +r.kcal, proteina: t.proteina + +r.proteina, carbos: t.carbos + +r.carbos, grasas: t.grasas + +r.grasas }), { kcal: 0, proteina: 0, carbos: 0, grasas: 0 });
  const m = S.meta || {};
  const pctK = m.kcal ? tot.kcal / m.kcal * 100 : 0;
  const colK = pctK > 115 ? cssVar('--rojo') : pctK >= 90 ? cssVar('--verde') : cssVar('--tx');
  const esHoy = f === hoy();

  $('#view').innerHTML = `
    <section class="sec">
      <div class="row between">
        <button class="btn ghost icon" id="c-ant" aria-label="Día anterior">${IC.izq}</button>
        <h2 style="text-transform:capitalize;font-size:16px">${esHoy ? 'Hoy' : esc(fLarga(f))}</h2>
        <button class="btn ghost icon" id="c-sig" aria-label="Día siguiente" ${esHoy ? 'disabled' : ''}>${IC.der}</button>
      </div>
      <div class="kcal" style="margin-top:14px"><b>${r0(tot.kcal)}</b><span class="muted">de ${m.kcal ?? '—'} kcal</span></div>
      <div class="bar" style="margin-top:8px" role="img" aria-label="Calorías ${r0(pctK)}% de la meta"><i style="--p:${Math.min(pctK, 100)};background:${colK}"></i></div>
      ${macroBar('Proteína', tot.proteina, m.proteina_g, cssVar('--tx'))}
      ${macroBar('Carbohidratos', tot.carbos, m.carbos_g, cssVar('--tx'))}
      ${macroBar('Grasas', tot.grasas, m.grasas_g, cssVar('--tx'))}
    </section>
    ${esHoy ? `<section class="sec"><h2>Para tu próxima comida</h2><p style="margin:6px 0 0">${esc(sugerencia(tot))}</p></section>` : ''}
    <section class="sec" id="c-meals">
      ${COMIDAS.map(c => {
        const it = (regs || []).filter(r => r.comida === c);
        const k = it.reduce((s, r) => s + +r.kcal, 0);
        return `<div class="meal"><div class="row between"><h3>${COMIDA_TX[c]} <span class="small muted" style="font-weight:400">${it.length ? r0(k) + ' kcal' : ''}</span></h3><button class="btn sec" data-add="${c}" aria-label="Agregar a ${COMIDA_TX[c].toLowerCase()}" style="min-height:44px;padding:8px 14px">${IC.mas}Agregar</button></div>
          ${it.length ? '' : `<p class="small muted" style="margin:6px 0 0">Sin registros.</p>`}
          ${it.map(r => `<div class="item"><div>${esc(r.nombre)} <span class="muted small">${r1(r.gramos)} g</span><div class="small muted">${r0(r.kcal)} kcal · P ${r1(r.proteina)} · C ${r1(r.carbos)} · G ${r1(r.grasas)}</div></div><button class="x" data-del="${r.id}" aria-label="Eliminar ${esc(r.nombre)}">${IC.x}</button></div>`).join('')}</div>`;
      }).join('')}
    </section>`;

  $('#c-ant').onclick = () => { S.fechaComida = sumaDias(f, -1); ir('comida'); };
  $('#c-sig').onclick = () => { S.fechaComida = sumaDias(f, 1); ir('comida'); };
  $('#c-meals').onclick = async e => {
    const a = e.target.closest('[data-add]'), d = e.target.closest('[data-del]');
    if (a) dlgAlimento(f, a.dataset.add);
    if (d) ocupado(d, async () => { const { error: er } = await sb.from('registros_alimento').delete().eq('id', d.dataset.del); if (er) return toast(errMsg(er)); toast('Registro eliminado'); ir('comida'); });
  };
}

function dlgAlimento(fecha, comida) {
  let sel = null;
  const b = abrir(`Agregar a ${COMIDA_TX[comida].toLowerCase()}`, `
    <input id="a-q" type="search" placeholder="Buscar alimento (ej: huevo, arroz)" autocomplete="off">
    <div id="a-res" style="margin-top:6px"></div>
    <button class="btn ghost full" id="a-off" style="margin-top:6px">Buscar en Open Food Facts</button>
    <div id="a-sel" style="display:none;margin-top:12px">
      <div class="alert" id="a-info"></div>
      <label for="a-g">Cantidad (gramos)</label>
      <input id="a-g" inputmode="decimal">
      <div class="small muted" id="a-calc" style="margin-top:6px"></div>
      <button class="btn full" id="a-ok" style="margin-top:12px">Agregar</button>
    </div>
    <details style="margin-top:16px"><summary class="small" style="cursor:pointer">Crear un alimento propio</summary>
      <label for="n-nom">Nombre</label><input id="n-nom">
      <p class="small muted" style="margin:6px 0 0">Valores por 100 g (están en la etiqueta nutricional).</p>
      <div class="grid2">
        <div><label for="n-k">Calorías</label><input id="n-k" inputmode="decimal"></div>
        <div><label for="n-p">Proteína (g)</label><input id="n-p" inputmode="decimal"></div>
        <div><label for="n-c">Carbohidratos (g)</label><input id="n-c" inputmode="decimal"></div>
        <div><label for="n-gr">Grasas (g)</label><input id="n-gr" inputmode="decimal"></div>
      </div>
      <button class="btn sec full" id="n-ok" style="margin-top:12px">Guardar alimento</button>
    </details>`);
  const norm = s => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  const pintar = (lista, fuente) => {
    $('#a-res', b).innerHTML = lista.length ? lista.slice(0, 12).map((a, i) => `<button class="res" data-i="${i}"><span>${esc(a.nombre)}${a.fuente === 'propio' ? '<span class="tag">propio</span>' : a.fuente === 'openfoodfacts' ? '<span class="tag">OFF</span>' : ''}</span><span class="small muted">${r0(a.kcal)} kcal · P ${r1(a.proteina)}</span></button>`).join('')
      : `<p class="small muted">${fuente === 'off' ? 'Sin resultados en Open Food Facts.' : 'Sin resultados en la base. Prueba Open Food Facts o crea un alimento propio.'}</p>`;
    $('#a-res', b).onclick = e => { const r = e.target.closest('.res'); if (!r) return; elegir(lista[r.dataset.i]); b.querySelectorAll('.res').forEach(x => x.classList.toggle('on', x === r)); };
  };
  const buscar = () => { const q = norm($('#a-q', b).value.trim()); pintar(q ? S.alimentos.filter(a => norm(a.nombre).includes(q)) : S.alimentos.filter(a => a.fuente !== 'base').concat(S.alimentos.filter(a => a.fuente === 'base')).slice(0, 8)); };
  const elegir = a => {
    sel = a; $('#a-sel', b).style.display = 'block';
    $('#a-info', b).innerHTML = `<b>${esc(a.nombre)}</b><div class="small">Por 100 g: ${r0(a.kcal)} kcal · P ${r1(a.proteina)} · C ${r1(a.carbos)} · G ${r1(a.grasas)}</div>`;
    $('#a-g', b).value = r0(a.porcion_g || 100); calc(); $('#a-g', b).focus();
  };
  const calc = () => { const g = num($('#a-g', b).value) || 0; if (!sel) return; $('#a-calc', b).textContent = `${r0(sel.kcal * g / 100)} kcal · ${r1(sel.proteina * g / 100)} g de proteína`; };
  $('#a-q', b).oninput = buscar; buscar(); setTimeout(() => $('#a-q', b).focus(), 50);
  $('#a-g', b).oninput = calc;
  $('#a-off', b).onclick = async () => {
    const q = $('#a-q', b).value.trim(); if (!q) return toast('Escribe qué buscar.');
    $('#a-res', b).innerHTML = '<div class="empty"><span class="spin"></span></div>';
    try {
      const u = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&json=1&page_size=15&fields=product_name,brands,nutriments`;
      const j = await (await fetch(u)).json();
      const lista = (j.products || []).filter(p => p.product_name && p.nutriments?.['energy-kcal_100g'] != null).map(p => ({
        nombre: `${p.product_name}${p.brands ? ' (' + p.brands.split(',')[0] + ')' : ''}`.slice(0, 120), kcal: +p.nutriments['energy-kcal_100g'] || 0,
        proteina: +p.nutriments.proteins_100g || 0, carbos: +p.nutriments.carbohydrates_100g || 0, grasas: +p.nutriments.fat_100g || 0, porcion_g: 100, fuente: 'openfoodfacts'
      }));
      pintar(lista, 'off');
    } catch { $('#a-res', b).innerHTML = '<p class="small muted">No se pudo consultar Open Food Facts.</p>'; }
  };
  $('#a-ok', b).onclick = ev => ocupado(ev.currentTarget, async () => {
    const g = num($('#a-g', b).value); if (!sel || !g || g <= 0) return toast('Indica los gramos.');
    let alimento_id = sel.id || null;
    if (!sel.id) { // guardar el producto de Open Food Facts como alimento propio para reusarlo
      const { data } = await sb.from('alimentos').insert({ usuario_id: S.user.id, nombre: sel.nombre, kcal: r1(sel.kcal), proteina: r1(sel.proteina), carbos: r1(sel.carbos), grasas: r1(sel.grasas), fuente: 'openfoodfacts' }).select().single();
      if (data) { S.alimentos.push(data); alimento_id = data.id; }
    }
    const f = g / 100;
    const { error } = await sb.from('registros_alimento').insert({ fecha, comida, alimento_id, nombre: sel.nombre, gramos: g, kcal: r1(sel.kcal * f), proteina: r1(sel.proteina * f), carbos: r1(sel.carbos * f), grasas: r1(sel.grasas * f) });
    if (error) return toast(errMsg(error));
    cerrar(); ir('comida');
  });
  $('#n-ok', b).onclick = ev => ocupado(ev.currentTarget, async () => {
    const a = { usuario_id: S.user.id, nombre: $('#n-nom', b).value.trim(), kcal: num($('#n-k', b).value), proteina: num($('#n-p', b).value) || 0, carbos: num($('#n-c', b).value) || 0, grasas: num($('#n-gr', b).value) || 0, fuente: 'propio' };
    if (!a.nombre || a.kcal == null) return toast('Nombre y calorías son obligatorios.');
    const { data, error } = await sb.from('alimentos').insert(a).select().single();
    if (error) return toast(errMsg(error));
    S.alimentos.push(data); b.querySelector('details').open = false; $('#a-q', b).value = data.nombre; buscar(); elegir(data);
  });
}

// ---------- PROGRESO ----------
async function vProgreso() {
  const desde = sumaDias(hoy(), -180);
  const [med, ser, evs] = await Promise.all([
    sb.from('mediciones').select('*').gte('fecha', desde).order('fecha'),
    sb.from('series').select('ejercicio_id, reps, carga_kg, sesiones!inner(fecha)').gte('sesiones.fecha', sumaDias(hoy(), -84)),
    sb.from('evaluaciones_semanales').select('*').order('semana', { ascending: false }).limit(16)
  ]);
  if (med.error) throw med.error;
  const M = med.data || [];
  const ms = s => deIso(s).getTime();
  const peso = M.filter(m => m.peso != null).map(m => ({ x: ms(m.fecha), y: +m.peso }));
  const prom = peso.map(p => { const v = peso.filter(q => q.x <= p.x && q.x > p.x - 21 * 864e5); return { x: p.x, y: v.reduce((s, q) => s + q.y, 0) / v.length }; });
  const cint = M.filter(m => m.cintura_cm != null).map(m => ({ x: ms(m.fecha), y: +m.cintura_cm }));

  // volumen semanal y mejor marca por ejercicio
  const S2 = ser.data || [];
  const porSem = {};
  S2.forEach(s => { const w = lunes(s.sesiones.fecha); porSem[w] = (porSem[w] || 0) + s.reps * Math.max(+s.carga_kg || 0, 1); });
  const vol = Object.entries(porSem).sort().map(([w, v]) => ({ x: ms(w), y: v }));
  const conDatos = [...new Set(S2.map(s => s.ejercicio_id))].map(ejercicio).filter(Boolean);

  const ult = M.filter(m => m.peso != null).at(-1);
  $('#view').innerHTML = `
    <section class="sec"><h2>Historial de la línea</h2><p class="small muted" style="margin:4px 0 0">Cada estación es una semana evaluada.</p>
      ${(evs.data || []).length ? `<div class="historial">${(evs.data || []).map(e => `<div class="hist"><span class="d" style="border-color:var(--${e.color})" aria-hidden="true"></span><div style="flex:1"><div class="row between"><b>Semana del ${fCorta(e.semana)}</b><b class="p">${e.puntaje}</b></div><div class="small" style="font-weight:700">${COLOR_TX[e.color]} · ${NIVEL_TX[e.nivel]}</div><div class="small muted">Entreno ${e.puntaje_entreno} · Nutrición ${e.puntaje_nutricion} · Cuerpo ${e.puntaje_cuerpo}</div>${(e.motivos || []).length ? `<div class="small" style="margin-top:2px">${esc(e.motivos[0])}</div>` : ''}</div></div>`).join('')}</div>` : '<p class="empty small">Tu primera estación aparecerá al terminar la semana.</p>'}
    </section>
    <section class="sec">
      <h2>Registrar medición</h2>
      <form id="m-f">
        <div class="grid2">
          <div><label for="m-fe">Fecha</label><input id="m-fe" type="date" value="${hoy()}" max="${hoy()}"></div>
          <div><label for="m-p">Peso (kg)</label><input id="m-p" inputmode="decimal" placeholder="${ult ? r1(ult.peso) : ''}"></div>
          <div><label for="m-c">Cintura (cm)</label><input id="m-c" inputmode="decimal" placeholder="opcional"></div>
          <div><label for="m-g">% grasa</label><input id="m-g" inputmode="decimal" placeholder="opcional"></div>
        </div>
        <button class="btn full" style="margin-top:12px">Guardar</button>
      </form>
      <p class="small muted" style="margin:8px 0 0">Pésate a la misma hora, idealmente en ayunas. El semáforo usa el promedio de 3 semanas, así un pesaje aislado no te confunde.</p>
    </section>
    <section class="sec"><h3>Peso</h3>${chart([{ pts: peso, color: cssVar('--mut'), dots: true, op: .7, w: 1.2, label: 'Pesajes' }, { pts: prom, color: cssVar('--linea'), w: 3, label: 'Promedio 3 semanas' }], { fmtY: v => r1(v), unidad: 'kg' })}</section>
    ${cint.length > 1 ? `<section class="sec"><h3>Cintura</h3>${chart([{ pts: cint, color: cssVar('--tx'), dots: true }], { fmtY: v => r0(v), unidad: 'cm' })}</section>` : ''}
    <section class="sec"><h3>Volumen de entrenamiento semanal</h3><p class="small muted" style="margin:2px 0 6px">Repeticiones × carga (o repeticiones si es sin carga).</p>${chart([{ pts: vol, color: cssVar('--linea'), dots: true }], { fmtY: v => v >= 1000 ? r1(v / 1000) + 'k' : r0(v) })}</section>
    ${conDatos.length ? `<section class="sec"><h3>Cargas por ejercicio</h3><select id="p-ej" style="margin-top:8px">${conDatos.map(e => `<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select><div id="p-ejg" style="margin-top:8px"></div></section>` : ''}
    `;

  $('#m-f').onsubmit = e => { e.preventDefault(); ocupado(e.target.querySelector('button'), async () => {
    const r = { fecha: $('#m-fe').value || hoy(), peso: num($('#m-p').value), cintura_cm: num($('#m-c').value), grasa_pct: num($('#m-g').value) };
    if (r.peso == null && r.cintura_cm == null && r.grasa_pct == null) return toast('Ingresa al menos un valor.');
    Object.keys(r).forEach(k => r[k] == null && delete r[k]);
    const { error } = await sb.from('mediciones').upsert(r, { onConflict: 'usuario_id,fecha' });
    if (error) return toast(errMsg(error));
    if (r.peso) await sb.rpc('calcular_mi_meta').then(({ data }) => { if (data) S.meta = data; });
    toast('Medición guardada'); ir('progreso');
  }); };
  const pintarEj = () => {
    const id = Number($('#p-ej').value), e = ejercicio(id);
    const porDia = {};
    S2.filter(s => s.ejercicio_id === id).forEach(s => { const v = e.usa_carga ? +s.carga_kg || 0 : +s.reps; porDia[s.sesiones.fecha] = Math.max(porDia[s.sesiones.fecha] || 0, v); });
    const pts = Object.entries(porDia).sort().map(([f, y]) => ({ x: ms(f), y }));
    $('#p-ejg').innerHTML = chart([{ pts, color: cssVar('--linea'), dots: true, label: e.usa_carga ? 'Carga máxima (kg)' : `Mejor serie (${UNIDAD_TX[e.unidad]})` }], { fmtY: v => e.usa_carga ? r1(v) : r0(v), enteros: !e.usa_carga });
  };
  if ($('#p-ej')) { $('#p-ej').onchange = pintarEj; pintarEj(); }
}

// ---------- PERFIL ----------
async function vPerfil() {
  const m = S.meta || {};
  $('#view').innerHTML = `
    <form class="card" id="pf">
      <h2>Tu perfil</h2>
      ${formPerfil(S.perfil)}
      <button class="btn full" style="margin-top:14px">Guardar cambios</button>
    </form>
    <div class="card">
      <h3>Metas de alimentación</h3>
      <div class="grid2 small" style="margin-top:8px"><div>Calorías: <b>${m.kcal ?? '—'}</b></div><div>Proteína: <b>${m.proteina_g ?? '—'} g</b></div><div>Carbohidratos: <b>${m.carbos_g ?? '—'} g</b></div><div>Grasas: <b>${m.grasas_g ?? '—'} g</b></div></div>
      <p class="small muted">Se calculan según tu objetivo, peso, estatura, edad y actividad, nunca por debajo de un piso seguro. Se actualizan al registrar tu peso.</p>
      <button class="btn sec" id="pf-meta">Recalcular metas</button>
    </div>
    <div class="card">
      <h3>Tus datos</h3>
      <p class="small muted">Son tuyos: puedes descargarlos o eliminarlos en cualquier momento.</p>
      <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn ghost" id="pf-exp">Exportar mis datos</button><button class="btn ghost" id="pf-del" style="color:var(--rojo)">Eliminar mis datos</button></div>
    </div>
    <div class="card row between"><span class="small muted">${esc(S.user.email)}</span><button class="btn ghost" id="pf-out">Cerrar sesión</button></div>
    <p class="aviso">Evolva no reemplaza a un profesional de la salud. Ante dolor, lesiones o metas extremas, consulta a un médico o nutricionista.</p>`;
  chipsUnicos('#p-obj, #p-niv');
  $('#pf').onsubmit = e => { e.preventDefault(); ocupado(e.target.querySelector('button.full'), async () => {
    const p = leerPerfil(); const nivelNuevo = p.nivel; delete p.nivel;
    const { data, error } = await sb.from('perfiles').update(p).eq('id', S.user.id).select().single();
    if (error) return toast(errMsg(error));
    S.perfil = data;
    if (nivelNuevo !== S.perfil.nivel) { const r = await sb.rpc('cambiar_mi_nivel', { p_nivel: nivelNuevo, p_motivo: 'Cambio manual desde Perfil' }); if (r.data) S.perfil = r.data; }
    const mm = await sb.rpc('calcular_mi_meta'); if (mm.data) S.meta = mm.data;
    refrescarHeader(); toast('Perfil actualizado'); ir('perfil');
  }); };
  $('#pf-meta').onclick = ev => ocupado(ev.currentTarget, async () => { const { data, error } = await sb.rpc('calcular_mi_meta'); if (error) return toast(errMsg(error)); S.meta = data; toast('Metas recalculadas'); ir('perfil'); });
  $('#pf-out').onclick = salir;
  $('#pf-exp').onclick = ev => ocupado(ev.currentTarget, exportarDatos);
  $('#pf-del').onclick = ev => ocupado(ev.currentTarget, () => eliminarDatos(vOnboarding));
}

// Exportar y eliminar funcionan siempre, incluso sin suscripción: los datos son de la persona.
async function exportarDatos() {
  const tablas = ['perfiles', 'sesiones', 'series', 'mediciones', 'registros_alimento', 'metas_nutricionales', 'evaluaciones_semanales', 'cambios_nivel'];
  const out = { exportado: new Date().toISOString() };
  for (const t of tablas) { const { data } = await sb.from(t).select('*'); out[t] = data || []; }
  const { data: propios } = await sb.from('alimentos').select('*').eq('usuario_id', S.user.id);
  out.alimentos_propios = propios || [];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = `evolva-${hoy()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function eliminarDatos(despues) {
  if (!confirm('Se eliminarán todos tus datos de Evolva: perfil, entrenamientos, comidas, mediciones y evaluaciones. No se puede deshacer. ¿Continuar?')) return;
  if (prompt('Escribe ELIMINAR para confirmar') !== 'ELIMINAR') return toast('No se eliminó nada.');
  const { error } = await sb.rpc('eliminar_mis_datos');
  if (error) return toast(errMsg(error));
  localStorage.removeItem(COLA); localStorage.removeItem(BORRADOR);
  toast('Tus datos fueron eliminados.'); S.perfil = null; despues();
}

// ---------- arranque ----------
sb.auth.onAuthStateChange((ev, session) => {
  // S.user se fija aquí mismo: Supabase puede avisar dos veces seguidas (INITIAL_SESSION y SIGNED_IN)
  // y sin esto la app arrancaba dos veces en paralelo.
  if (session?.user) { if (!S.user || S.user.id !== session.user.id) { S.user = session.user; setTimeout(() => iniciar(session.user), 0); } }
  else if (ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') { S.user = null; vLogin(); }
});
</script>
